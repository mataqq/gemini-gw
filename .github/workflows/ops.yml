name: ops
on:
  push:
    branches: [ops]
    paths:
      - 'ops_probe.py'
      - 'OPS_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: probe google project capability
        env:
          RT: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python ops_probe.py
      - name: commit result
        if: always()
        run: |
          git config user.name ops-bot
          git config user.email ops-bot@users.noreply.github.com
          git add OPS_RESULT.json || true
          git commit -m "ops result" || true
          git push origin HEAD:ops || true
