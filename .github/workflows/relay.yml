name: gemini-gw

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: gw-relay
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
      LOCAL_KEYS: ${{ secrets.LOCAL_KEYS }}
      DEFAULT_MODEL: ${{ secrets.DEFAULT_MODEL }}
      SUBDOMAIN: ${{ secrets.SUBDOMAIN }}
      BIND: 127.0.0.1
      PORT: "8080"
    steps:
      - uses: actions/checkout@v4

      - name: cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: relay and tunnel
        run: |
          chmod +x serve.sh
          nohup ./serve.sh > /tmp/sup.log 2>&1 &
          for i in $(seq 1 40); do [ -s /tmp/public_url.txt ] && break; sleep 5; done
          echo "::group::supervisor"
          tail -40 /tmp/sup.log
          echo "::endgroup::"
          URL=$(cat /tmp/public_url.txt 2>/dev/null || true)
          echo "PUBLIC_URL=$URL"
          if [ -z "$URL" ]; then echo "NO_PUBLIC_URL"; exit 1; fi
          for i in $(seq 1 8); do
            C=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 25 "$URL/healthz" || true)
            echo "selfcheck $i -> $C"
            [ "$C" = "200" ] && break
            sleep 8
          done
          echo "::group::healthz"
          curl -sS --max-time 25 "$URL/healthz" || true
          echo
          echo "::endgroup::"
          echo "::group::diag"
          curl -sS --max-time 150 "$URL/__diag" || true
          echo
          echo "::endgroup::"
          echo "GW_URL=$URL" >> "$GITHUB_ENV"

      - name: idle
        run: |
          echo "live at $GW_URL"
          sleep 20000
