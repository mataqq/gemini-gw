name: gemini-gw

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: gw-relay
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
      LOCAL_KEYS: ${{ secrets.LOCAL_KEYS }}
      DEFAULT_MODEL: ${{ secrets.DEFAULT_MODEL }}
      SUBDOMAIN: ${{ secrets.SUBDOMAIN }}
      BIND: 127.0.0.1
      PORT: "8080"
    steps:
      - uses: actions/checkout@v4

      - name: cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: start
        run: |
          chmod +x serve.sh
          nohup ./serve.sh > /tmp/sup.log 2>&1 &
          nohup python3 -u publish.py > /tmp/pub.log 2>&1 &
          for i in $(seq 1 60); do [ -s /tmp/public_url.txt ] && break; sleep 5; done
          echo "::group::supervisor"
          tail -n 50 /tmp/sup.log
          echo "::endgroup::"
          URL=$(cat /tmp/public_url.txt 2>/dev/null || true)
          echo "PUBLIC_URL=$URL"
          [ -n "$URL" ] || { echo "NO_PUBLIC_URL"; exit 1; }
          echo "GW_URL=$URL" >> "$GITHUB_ENV"

      - name: idle
        run: |
          echo "live at $GW_URL"
          sleep 20000
